name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: untrava
          POSTGRES_USER: untrava
          POSTGRES_PASSWORD: untrava
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U untrava -d untrava"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://untrava:untrava@localhost:5432/untrava
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Deploy Prisma migrations
        run: pnpm --filter @untrava/api prisma migrate deploy
      - name: Generate Prisma client
        run: pnpm --filter @untrava/api prisma generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Validate Prisma schema
        run: pnpm --filter @untrava/api prisma validate
